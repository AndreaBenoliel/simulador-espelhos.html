name: Renderizar cena
on: workflow_dispatch
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y blender
      - run: blender -b -noaudio --factory-startup --disable-autoexec --python-exit-code 1 --python render.py
      - uses: actions/upload-artifact@v4
        with:
          name: imagem-renderizada
          path: resultado.png
